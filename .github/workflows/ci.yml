name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check.sh
      - run: python3 -m unittest -v tests/test_zup_observer.py

  runtime:
    needs: static
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zup_kz
          POSTGRES_USER: zup_kz_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zup_kz_app -d zup_kz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout ZUP Kazakhstan
        uses: actions/checkout@v5
        with:
          path: zup-kz

      - name: Read platform revision
        id: platform
        run: echo "revision=$(cat zup-kz/platform-revision.txt)" >> "$GITHUB_OUTPUT"

      - name: Checkout platform fork
        uses: actions/checkout@v5
        with:
          repository: erkevibe/platform
          ref: ${{ steps.platform.outputs.revision }}
          path: platform

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build application with test modules
        working-directory: zup-kz
        env:
          ZUP_BUILD_PROFILES: assemble,embed-server,test-logics
        run: ./scripts/build.sh ../platform

      - name: Prepare isolated CI settings
        working-directory: zup-kz
        run: |
          cp conf/settings.properties.example conf/settings.properties
          sed -i 's/CHANGE_ME/ci_password/' conf/settings.properties
          sed -i 's/logics.topModule=ZUPKZ/logics.topModule=StatutoryGuardTest/' conf/settings.properties
          printf '\nsettings.enableAPI=1\nlogics.initialAdminPassword=ci-admin-only\n' >> conf/settings.properties

      - name: Run server regression
        working-directory: zup-kz
        run: ./scripts/ci-runtime-regression.sh

      - name: Prepare runtime evidence manifest
        if: always()
        working-directory: zup-kz
        run: |
          git rev-parse HEAD > runtime-candidate-sha.txt
          git rev-parse "HEAD^{tree}" > runtime-candidate-tree-sha.txt
          cp platform-revision.txt runtime-platform-sha.txt
          sha256sum target/lsfusion-server-0.1.0-SNAPSHOT.jar > runtime-jar.sha256
          find . -maxdepth 1 -type f \( -name '*.json' -o -name '*.log' -o -name '*.tsv' \) -print0 \
            | sort -z | xargs -0 -r sha256sum > runtime-evidence.sha256
          find logs -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum \
            > runtime-internal-logs.sha256

      - name: Upload synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-evidence-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            zup-kz/*.json
            zup-kz/*.log
            zup-kz/*.tsv
            zup-kz/runtime-*.txt
            zup-kz/runtime-*.sha256
