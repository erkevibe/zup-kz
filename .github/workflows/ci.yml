name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: zup_kz
          POSTGRES_USER: zup_kz_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zup_kz_app -d zup_kz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout ZUP Kazakhstan
        uses: actions/checkout@v5
        with:
          path: zup-kz

      - name: Checkout platform fork
        uses: actions/checkout@v5
        with:
          repository: erkevibe/platform
          # Last upstream-compatible revision verified by this application.
          ref: 68d154cb9082b1df5554ba31070870eb45c3b528
          path: platform

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build runnable server
        run: mvn --batch-mode --file zup-kz/pom.xml clean package -Passemble,embed-server

      - name: Prepare CI settings
        working-directory: zup-kz
        run: |
          cp conf/settings.properties.example conf/settings.properties
          sed -i 's/CHANGE_ME/ci_password/' conf/settings.properties
          sed -i 's/logics.topModule=ZUPKZ/logics.topModule=PayrollFormulaTest/' conf/settings.properties
          printf '\nsettings.enableAPI=2\n' >> conf/settings.properties

      - name: Smoke-test lsFusion startup
        working-directory: zup-kz
        run: |
          java -Xms256m -Xmx2g -jar target/lsfusion-server-0.1.0-SNAPSHOT.jar > server.log 2>&1 &
          server_pid=$!
          trap 'kill -TERM "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..90}; do
            if grep -q 'Server has successfully started' server.log; then
              curl --fail --silent --show-error \
                'http://localhost:7651/exec?action=ZUPKZ.payrollFormulaTest' \
                --output payroll-result.json

              python3 tests/assert_payroll.py payroll-result.json

              curl --fail --silent --show-error \
                'http://localhost:7651/exec?action=ZUPKZ.payrollStage0Test' \
                --output stage0-result.json

              python3 tests/assert_stage0.py stage0-result.json

              curl --fail --silent --show-error \
                'http://localhost:7651/exec?action=ZUPKZ.hrWorkflowTest' \
                --output hr-workflow-result.json

              python3 tests/assert_hr_workflow.py hr-workflow-result.json

              curl --fail --silent --show-error \
                'http://localhost:7651/exec?action=ZUPKZ.timeWorkflowTest' \
                --output time-workflow-result.json

              python3 tests/assert_time_workflow.py time-workflow-result.json

              curl --fail --silent --show-error \
                'http://localhost:7651/exec?action=ZUPKZ.leaveWorkflowTest' \
                --output leave-workflow-result.json

              python3 tests/assert_leave_workflow.py leave-workflow-result.json

              curl --fail --silent --show-error \
                'http://localhost:7651/exec?action=ZUPKZ.sickLeaveWorkflowTest' \
                --output sick-leave-workflow-result.json

              python3 tests/assert_sick_leave_workflow.py sick-leave-workflow-result.json

              curl --fail --silent --show-error \
                'http://localhost:7651/exec?action=ZUPKZ.accessWorkflowTest' \
                --output access-workflow-result.json

              python3 tests/assert_access_workflow.py access-workflow-result.json

              kill -TERM "$server_pid"
              wait "$server_pid" || true
              trap - EXIT
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi

            sleep 1
          done

          cat server.log
          exit 1
