name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZUP Kazakhstan
        uses: actions/checkout@v5
        with:
          path: zup-kz

      - name: Checkout platform fork
        uses: actions/checkout@v5
        with:
          repository: erkevibe/platform
          ref: develop
          path: platform

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn --batch-mode --file zup-kz/pom.xml clean package
